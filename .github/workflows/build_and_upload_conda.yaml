name: Build and upload conda package

on:
  # release:
  #   types: [published]
  push:
    branches:
      - master
  pull_request:
    types: [closed]
    branches:
      - master

defaults:
  run:
    # Login shell so that setup-miniconda's conda initialization is sourced and
    # the base environment is active in every step.
    shell: bash -el {0}

jobs:
  # Guards the single-source-of-truth invariant: the root VERSION file must be well formed and must
  # be what the conda recipe renders. Everything else (C header, Fortran module, Python module) is
  # generated from the same file by CMake and is checked by the test suites.
  version_check:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Conda
      uses: conda-incubator/setup-miniconda@v3
      with:
        auto-update-conda: true
        channels: conda-forge
        channel-priority: strict
        conda-remove-defaults: true

    - name: Install build tools
      run: conda install -n base -c conda-forge -y conda-build

    - name: Check VERSION file and rendered recipe version agree
      run: |
        version="$(tr -d '[:space:]' < VERSION)"
        if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "VERSION must hold a MAJOR.MINOR.PATCH version; got '$version'" >&2
          exit 1
        fi
        echo "VERSION file: $version"

        # `conda render` prints the recipe with the jinja version substitution applied.
        rendered="$(conda render conda -c conda-forge --output | head -n 1)"
        echo "Rendered package: $rendered"
        case "$rendered" in
          *"pyoti-$version-"*) ;;
          *)
            echo "Rendered conda package does not carry version $version" >&2
            exit 1
            ;;
        esac

  build_and_upload:
    needs: version_check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-64
          - os: macos-15-intel  # Intel runner (macos-13 was retired 2025-12-04)
            target: osx-64
          - os: macos-latest    # Apple silicon runner
            target: osx-arm64
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Conda
      uses: conda-incubator/setup-miniconda@v3
      with:
        auto-update-conda: true
        # conda-forge only: avoids the `defaults` channel Terms-of-Service
        # prompt that makes non-interactive conda runs fail.
        channels: conda-forge
        channel-priority: strict
        conda-remove-defaults: true

    - name: Install build tools
      run: |
        # conda-build must live in the *base* env: `conda build` is resolved as a
        # plugin of the conda executable itself, not of the activated environment.
        conda install -n base -c conda-forge -y conda-build anaconda-client
        conda build --version

    - name: Build Conda package
      run: |
        conda build conda -c conda-forge --output-folder "$GITHUB_WORKSPACE/dist"

    - name: Upload Conda package
      if: github.event_name == 'push' || github.event.pull_request.merged == true
      env:
        ANACONDA_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
      run: |
        shopt -s nullglob
        packages=("$GITHUB_WORKSPACE"/dist/${{ matrix.target }}/pyoti-*.conda "$GITHUB_WORKSPACE"/dist/${{ matrix.target }}/pyoti-*.tar.bz2)
        if [ ${#packages[@]} -eq 0 ]; then
          echo "No package found in dist/${{ matrix.target }}" >&2
          exit 1
        fi
        anaconda -t "$ANACONDA_TOKEN" upload -u mauriaristi "${packages[@]}" \
          --channel main --label main --force
