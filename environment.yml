name: pyoti
channels:
  - conda-forge
  - anaconda
  - defaults
dependencies:
  - python=3.13.*
  - numpy>=2.1,<3
  - scipy
  # LAPACK / BLAS for the C core (found by CMake's FindLAPACK). conda-forge's stubs are switchable
  # between OpenBLAS, MKL, Accelerate and netlib with `blas=*=<impl>`.
  - libblas
  - liblapack
  - cython>=3.0
  - pandas
  - make
  - cmake
  - pip
  - setuptools
  - pytest
  - sympy
  - ipykernel
  - conda-forge::pyvista
  - conda-forge::gmsh
  - conda-forge::python-gmsh
  - conda-forge::vtk<9.4
  - conda-forge::scikit-sparse<0.5  # 0.5 returns a tuple from cholesky(); sparse/linalg.pxi needs the 0.4 Factor
  - conda-forge::scikit-umfpack
