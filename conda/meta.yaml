package:
  name: pyoti
  version: "1.0.0"

source:
  path: ..

build:
  number: 0
  script: |
    mkdir -p build
    cd build
    cmake ..
    make
    make gendata
    cp -r pyoti $SP_DIR/pyoti
    cp -r data $SP_DIR/data

requirements:
  # Tools that run on the build machine (compilers, generators).
  build:
    - {{ compiler('c') }}
    - {{ compiler('fortran') }}
    - make
    - cmake
    - llvm-openmp  # [osx]

  # Libraries linked against / headers compiled against, for the target platform.
  host:
    - python 3.13.*
    - numpy >=2.1,<3
    - cython >=3.0
    - pip
    - llvm-openmp  # [osx]

  # What the installed package needs at import time.
  run:
    - python 3.13.*
    - numpy >=2.1,<3
    - scipy
    - pandas
    - pyvista
    - gmsh
    - python-gmsh
    - vtk <9.4
    - scikit-sparse
    - scikit-umfpack

test:
  imports:
    - pyoti
  commands:
    - python -c "import pyoti"

about:
  home: https://github.com/imqcam/otilib
  license: GPL-3.0-or-later
  license_file: LICENSE
  summary: Order Truncated Imaginary (OTI) numbers library for multicomplex/hypercomplex automatic differentiation.
