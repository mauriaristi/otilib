{% set version_match = load_file_regex(
     load_file="../VERSION",
     regex_pattern="([0-9]+\.[0-9]+\.[0-9]+)",
     from_recipe_dir=True) %}
{% set version = version_match.group(1) %}

package:
  name: pyoti
  version: "{{ version }}"

source:
  path: ..

build:
  number: 0
  script: |
    # Abort the build on the first failing command, so that a failed compilation or a failed test
    # never produces a package.
    set -ex

    # `source: path: ..` copies the whole working tree, including any build/ directory the developer
    # already has. Its CMakeCache.txt holds absolute paths from the original location, so configuring
    # on top of it fails; start from a clean directory instead.
    rm -rf build
    mkdir build
    cd build
    # ${CMAKE_ARGS} (unquoted, word-split on purpose) carries conda-build's toolchain settings:
    # sysroot, find-root path, deployment target and cross-compilation flags.
    # Generic + $PREFIX: link conda-forge's libblas / liblapack stubs (switchable after install).
    # Without the prefix path, macOS finds the SDK's libblas.tbd (Accelerate) first.
    cmake ${CMAKE_ARGS} -DOTI_BLA_VENDOR=Generic -DCMAKE_PREFIX_PATH="$PREFIX" ..
    make

    # Native (C / Fortran / C++) test suite. This runs in the build environment, where the compilers
    # and the freshly built binaries are available, so a package is only produced if the compiled
    # library actually works on this platform.
    ctest --output-on-failure

    cp -r pyoti $SP_DIR/pyoti

requirements:
  # Tools that run on the build machine (compilers, generators).
  build:
    - {{ compiler('c') }}
    - {{ compiler('fortran') }}
    # The C++ test suite (tests/cpp) is compiled here too; without this it silently falls back to
    # whatever system compiler the runner happens to have.
    - {{ compiler('cxx') }}
    - make
    - cmake
    - llvm-openmp  # [osx]

  # Libraries linked against / headers compiled against, for the target platform.
  host:
    - python 3.13.*
    - numpy >=2.1,<3
    - cython >=3.0
    - pip
    # tmp_src/setup.py (generated from src/python/pyoti/cython/setup.py.in) does
    # `from setuptools import setup, Extension`. conda-forge's python >=3.12 and pip no longer
    # depend on setuptools, so it must be listed explicitly or the oticython target fails with
    # "ModuleNotFoundError: No module named 'setuptools'".
    - setuptools
    - llvm-openmp  # [osx]
    # LAPACK / BLAS for the C core. Their run_exports add the matching run requirements.
    - libblas
    - liblapack

  # What the installed package needs at import time.
  run:
    - python 3.13.*
    - numpy >=2.1,<3
    - scipy
    - pandas
    - pyvista
    - gmsh
    - python-gmsh
    - vtk <9.4
    - scikit-sparse <0.5  # 0.5 returns a tuple from cholesky(); sparse/linalg.pxi needs the 0.4 Factor
    - scikit-umfpack

test:
  # Copied into the test working directory so that the Python suite can run against the INSTALLED
  # package (the build tree is gone by this point). VERSION comes along because the version tests
  # compare the installed version against the source of truth.
  source_files:
    - VERSION
    - tests/python

  requires:
    - pytest
    - sympy

  imports:
    - pyoti

  commands:
    - python -c "import pyoti"
    # The package version, the Python sources and the compiled C library must all agree; a mismatch
    # means the recipe and the build tree came from different versions of the source.
    - python -c "import pyoti; assert pyoti.__version__ == '{{ version }}', pyoti.__version__"
    - python -c "import pyoti, pyoti.core; assert pyoti.core.c_version() == pyoti.__version__, pyoti.core.c_version()"
    # Full Python suite against the installed package: imports, direction-helper tables, derivative
    # accuracy and version consistency. The native suite already ran via ctest during the build.
    - pytest tests/python -v

about:
  doc_url: https://mauriaristi.github.io/otilib/
  dev_url: https://github.com/mauriaristi/otilib
  license: GPL-3.0-or-later
  license_file: LICENSE
  summary: Order Truncated Imaginary (OTI) numbers library for hypercomplex automatic differentiation.
  description: |
    OTIlib is an open-source library that implements the  Order Truncated Imaginary (OTI) Numbers. 
    OTI numbers allow the calculation of efficient high-order, multivariate derivatives in computer
    programs.
